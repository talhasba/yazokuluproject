<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digestible program pages — prototype</title>
<style>
  :root {
    --ink: #17213b; --muted: #667085; --brand: #3157d5; --brand-dark: #2342ad;
    --soft: #f1f5ff; --line: #e4e8f0; --bg: #f7f8fb; --card: #fff;
    --warn-bg: #fff7e6; --warn-ink: #8a5a00; --ok-bg: #e8f7ee; --ok-ink: #14663a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .bar { position: sticky; top: 0; z-index: 5; background: #fff; border-bottom: 1px solid var(--line); padding: 10px 20px; display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: center; }
  .bar h1 { font-size: 14px; margin: 0; color: var(--muted); font-weight: 600; letter-spacing: .02em; text-transform: uppercase; }
  .group { display: flex; align-items: center; gap: 8px; }
  .group > label { font-size: 12px; color: var(--muted); font-weight: 600; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: #fff; }
  .seg button { border: 0; background: transparent; padding: 6px 11px; font: inherit; font-size: 13px; color: var(--ink); cursor: pointer; border-right: 1px solid var(--line); }
  .seg button:last-child { border-right: 0; }
  .seg button[aria-pressed="true"] { background: var(--brand); color: #fff; }
  main { max-width: 1040px; margin: 0 auto; padding: 24px 20px 80px; }
  .note { font-size: 13px; color: var(--muted); margin: 0 0 18px; }
  .note b { color: var(--ink); }

  /* shared page pieces */
  .crumb { font-size: 13px; color: var(--brand); font-weight: 600; margin-bottom: 6px; }
  h2.title { font-size: 30px; line-height: 1.2; margin: 0 0 6px; }
  .sub { color: var(--muted); margin-bottom: 18px; }
  .status { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; vertical-align: middle; margin-left: 8px; }
  .status.ready { background: var(--ok-bg); color: var(--ok-ink); }
  .status.needs_review { background: var(--warn-bg); color: var(--warn-ink); }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 20px; }
  .fact { background: #fff; padding: 11px 14px; }
  .fact small { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 700; }
  .fact span { font-weight: 600; font-size: 14.5px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; }
  .card h3 { margin: 0 0 12px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--brand-dark); }
  ul.b { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; }
  ul.b li { display: flex; gap: 11px; align-items: flex-start; }
  ul.b li::before { content: ""; flex: 0 0 auto; width: 7px; height: 7px; border-radius: 99px; background: var(--brand); margin-top: 8px; }
  ul.b li b { font-weight: 650; }
  ul.b li .t { color: #475467; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip { background: var(--soft); color: var(--brand-dark); border-radius: 999px; padding: 4px 11px; font-size: 13px; font-weight: 600; }
  .focus { font-size: 18px; line-height: 1.45; font-weight: 550; padding: 16px 20px; border-left: 4px solid var(--brand); background: var(--soft); border-radius: 0 12px 12px 0; margin-bottom: 18px; }
  .check { background: var(--warn-bg); border: 1px solid #f3dca7; border-radius: 12px; padding: 12px 16px; margin-top: 18px; color: var(--warn-ink); font-size: 13.5px; }
  .check b { display: block; margin-bottom: 4px; }
  .check ul { margin: 0; padding-left: 18px; }
  .stack { display: grid; gap: 16px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }

  .sched { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
  .sched li { display: grid; grid-template-columns: 64px 1fr; gap: 14px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
  .sched li:last-child { border-bottom: 0; }
  .sched li.nt { grid-template-columns: 1fr; }
  .sched .tm { font-weight: 700; color: var(--brand-dark); font-variant-numeric: tabular-nums; }
  .sched .t { color: #475467; }
  .snote { margin: 10px 0 0; font-size: 12.5px; color: var(--muted); }

  /* B: accordion */
  details.acc { background: #fff; border: 1px solid var(--line); border-radius: 12px; }
  details.acc + details.acc { margin-top: 10px; }
  details.acc summary { cursor: pointer; padding: 14px 18px; font-weight: 650; list-style: none; display: flex; justify-content: space-between; align-items: center; }
  details.acc summary::-webkit-details-marker { display: none; }
  details.acc summary::after { content: "+"; font-size: 20px; color: var(--brand); }
  details.acc[open] summary::after { content: "–"; }
  details.acc .in { padding: 0 18px 16px; }
  .count { font-weight: 500; color: var(--muted); font-size: 13px; margin-left: 8px; }

  /* C: focus-first with sidebar */
  .cwrap { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 24px; align-items: start; }
  .side { position: sticky; top: 70px; display: grid; gap: 14px; }
  .side .row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .side .row:last-child { border-bottom: 0; }
  .side .row small { color: var(--muted); font-weight: 600; }
  .side .row span { font-weight: 600; text-align: right; }
  .tl { list-style: none; margin: 0; padding: 0 0 0 18px; border-left: 2px solid var(--line); display: grid; gap: 16px; }
  .tl li { position: relative; }
  .tl li::before { content: ""; position: absolute; left: -25px; top: 6px; width: 10px; height: 10px; border-radius: 99px; background: var(--brand); box-shadow: 0 0 0 3px var(--soft); }
  .tl li b { display: block; }
  .tl li .t { color: #475467; font-size: 14.5px; }
  @media (max-width: 800px) { .cwrap { grid-template-columns: 1fr; } .side { position: static; } h2.title { font-size: 25px; } }

  /* current site (approximation) */
  .now .warnbar { background: #fdecec; color: #8a1f1f; border-radius: 10px; padding: 9px 14px; font-size: 13px; margin-bottom: 14px; }
  .now section { margin-bottom: 22px; }
  .now section h3 { font-size: 20px; margin: 0 0 10px; text-transform: none; letter-spacing: 0; color: var(--ink); }
  .now ul.b li { font-size: 14px; color: #475467; }
</style>
</head>

/* ------------------------------------------------------------------ */
const LABELS = {
  en: { glance:"At a glance", focus:"Focus", outcomes:"You'll leave with", fit:"Good fit if…", extras:"Beyond the classroom", topics:"Topics", check:"Needs source check",
        age:"Age", duration:"Duration", dates:"Dates", price:"Price", location:"Location", format:"Format", ready:"Ready", needs_review:"Needs review", in_person:"In person", online:"Online", hybrid:"Hybrid", by:"by", units:{week:"week",weeks:"weeks"}, notListed:"Not listed",
        now:"Current site (approx.)", nowWarn:"Approximation of today's detail page: the live script chops the source text into sentence bullets (max 10) with no cleaning.",
        note:"<b>Same content, four presentations.</b> Facts (age, price, dates…) come live from <code>programs.normalized.json</code>; the bullets are hand-written digests standing in for what the pipeline would generate. Yellow box = data issues found while digesting." },
  tr: { glance:"Bir bakışta", focus:"Odak", outcomes:"Programın sonunda", fit:"Şunlar için uygun…", extras:"Sınıfın dışında", topics:"Konular", check:"Kaynak kontrolü gerekli",
        age:"Yaş", duration:"Süre", dates:"Tarihler", price:"Ücret", location:"Konum", format:"Format", ready:"Hazır", needs_review:"İnceleme gerekli", in_person:"Yüz yüze", online:"Çevrimiçi", hybrid:"Karma", by:"—", units:{week:"hafta",weeks:"hafta"}, notListed:"Belirtilmemiş",
        now:"Şu anki site (yaklaşık)", nowWarn:"Bugünkü detay sayfasının yaklaşık hali: canlı betik kaynak metni temizlemeden en fazla 10 cümle maddesine böler.",
        note:"<b>Aynı içerik, dört sunum.</b> Olgular (yaş, ücret, tarih…) doğrudan <code>programs.normalized.json</code> dosyasından gelir; maddeler, üretim hattının çıkaracağı özetin elle yazılmış örnekleridir. Sarı kutu = özetlerken bulunan veri sorunları." }
};
const VARIANTS = [["A","A · Cards"],["B","B · Accordion"],["C","C · Focus + timeline"],["N","Current site"]];

const state = { p: 0, v: "A", l: "en" };
const q = new URLSearchParams(location.search);
const ids = Object.keys(DIGESTS);
if (q.has("p")) state.p = Math.min(+q.get("p") || 0, ids.length - 1);
if (q.get("v") && "ABCN".includes(q.get("v"))) state.v = q.get("v");
if (q.get("l") === "tr") state.l = "tr";

let DATA = {};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function fmtDates(arr, l) {
  const mon = l === "tr" ? ["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"] : ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const one = s => { const m = /^(\d{4})-(\d\d)-(\d\d)/.exec(s); return m ? `${+m[3]} ${mon[+m[2]-1]} ${m[1]}` : s; };
  return (arr || []).map(d => d.includes("/") && /^\d{4}-/.test(d) ? d.split("/").map(one).join(" – ") : one(d));
}
function facts(rec, dg, l) {
  const L = LABELS[l];
  const mode = (rec.delivery_modes || [])[0];
  const dur = rec.duration ? rec.duration.replace(/weeks?/i, m => (l === "tr" ? "hafta" : m)) : "";
  return [
    [L.age, dg.ageLabel ? dg.ageLabel[l] : ((rec.age_ranges || []).join(", ") || L.notListed)],
    [L.duration, dur || L.notListed],
    [L.dates, fmtDates(rec.dates, l).join(" · ") || L.notListed],
    [L.price, rec.price?.display || L.notListed],
    [L.location, rec.location || L.notListed],
    [L.format, L[mode] || mode || L.notListed]
  ];
}
const bullets = (arr, fn) => `<ul class="b">${arr.map(fn).join("")}</ul>`;
const li = x => `<li><span class="t">${esc(x)}</span></li>`;
const liLead = x => `<li><span class="t"><b>${esc(x.lead)}</b> — ${esc(x.text)}</span></li>`;
const chips = t => `<div class="chips">${t.map(x => `<span class="chip">${esc(x)}</span>`).join("")}</div>`;
const card = (title, body) => `<div class="card"><h3>${esc(title)}</h3>${body}</div>`;

function header(rec, l) {
  const L = LABELS[l];
  const title = l === "tr" && rec.title_tr ? rec.title_tr : rec.title;
  return `<div class="crumb">${esc(rec.provider_label || rec.provider)}</div>
    <h2 class="title">${esc(title)}<span class="status ${rec.publish_status}">${L[rec.publish_status]}</span></h2>
    <div class="sub">${esc(rec.location)}</div>`;
}
function factsStrip(rec, dg, l) {
  return `<div class="facts">${facts(rec, dg, l).map(([k, v]) => `<div class="fact"><small>${esc(k)}</small><span>${esc(v)}</span></div>`).join("")}</div>`;
}
function scheduleBody(s) {
  return `<ul class="sched">${s.items.map(i => i.time
    ? `<li><span class="tm">${esc(i.time)}</span><span class="t">${esc(i.text)}</span></li>`
    : `<li class="nt"><span class="t">${i.lead ? `<b>${esc(i.lead)}</b> — ` : ""}${esc(i.text)}</span></li>`).join("")}</ul>` +
    (s.note ? `<p class="snote">${esc(s.note)}</p>` : "");
}
function scheduleCard(d) { return d.schedule ? card(d.schedule.title, scheduleBody(d.schedule)) : ""; }
function flagsBox(d, l) {
  if (!d.flags?.length) return "";
  return `<div class="check"><b>⚠ ${LABELS[l].check}</b><ul>${d.flags.map(f => `<li>${esc(f)}</li>`).join("")}</ul></div>`;
}

/* --- Variant A: scannable cards */
function viewA(rec, dg, l) {
  const d = dg[l], L = LABELS[l];
  return header(rec, l) + factsStrip(rec, dg, l) +
    `<div class="focus">${esc(d.focus)}</div>` +
    `<div class="stack">` +
      card(L.glance, bullets(d.highlights, li)) +
      `<div class="grid2">` +
        card(d.doTitle, bullets(d.do, liLead)) +
        `<div class="stack">` +
          card(L.outcomes, bullets(d.outcomes, li)) +
          card(L.fit, bullets(d.fit, li)) +
          (d.extras.length ? card(L.extras, bullets(d.extras, li)) : "") +
        `</div>` +
      `</div>` +
      scheduleCard(d) +
    `</div>` + flagsBox(d, l);
}

/* --- Variant B: accordion (good for long programs) */
function viewB(rec, dg, l) {
  const d = dg[l], L = LABELS[l];
  const sec = (title, n, body, open) => `<details class="acc"${open ? " open" : ""}><summary><span>${esc(title)}<span class="count">${n}</span></span></summary><div class="in">${body}</div></details>`;
  return header(rec, l) + factsStrip(rec, dg, l) +
    `<div class="card" style="margin-bottom:14px"><h3>${L.glance}</h3>${bullets(d.highlights, li)}</div>` +
    sec(d.doTitle, d.do.length, bullets(d.do, liLead), true) +
    sec(L.outcomes, d.outcomes.length, bullets(d.outcomes, li), false) +
    sec(L.fit, d.fit.length, bullets(d.fit, li), false) +
    (d.extras.length ? sec(L.extras, d.extras.length, bullets(d.extras, li), false) : "") +
    (d.schedule ? sec(d.schedule.title, d.schedule.items.length, scheduleBody(d.schedule), false) : "") +
    flagsBox(d, l);
}

/* --- Variant C: focus-first, timeline, sticky facts */
function viewC(rec, dg, l) {
  const d = dg[l], L = LABELS[l];
  const side = facts(rec, dg, l).map(([k, v]) => `<div class="row"><small>${esc(k)}</small><span>${esc(v)}</span></div>`).join("");
  return header(rec, l) + `<div class="cwrap"><div class="stack">` +
      `<div class="focus" style="margin-bottom:0">${esc(d.focus)}</div>` +
      card(L.topics, chips(d.tags)) +
      card(d.doTitle, `<ol class="tl">${d.do.map(x => `<li><b>${esc(x.lead)}</b><span class="t">${esc(x.text)}</span></li>`).join("")}</ol>`) +
      card(L.outcomes, bullets(d.outcomes, li)) +
      scheduleCard(d) +
      `<div class="grid2">${card(L.fit, bullets(d.fit, li))}${d.extras.length ? card(L.extras, bullets(d.extras, li)) : ""}</div>` +
      flagsBox(d, l) +
    `</div><aside class="side"><div class="card"><h3>${L.glance}</h3>${side}</div>${card(L.glance, bullets(d.highlights, li))}</aside></div>`;
}

/* --- "Now": approximation of today's site (same chunker as catalogue-cleanup.js) */
function chunkText(text, max = 210) {
  const words = text.split(/\s+/).filter(Boolean), out = []; let cur = "";
  words.forEach(w => { const c = cur ? cur + " " + w : w; if (c.length > max && cur) { out.push(cur); cur = w; } else cur = c; });
  if (cur) out.push(cur); return out;
}
function makeBullets(text) {
  const cleaned = text.replace(/\s+/g, " ").replace(/\.([A-ZÇĞİÖŞÜ])/g, ". $1").trim();
  const seen = new Set();
  return cleaned.split(/(?<=[.!?])\s+(?=[A-ZÇĞİÖŞÜ0-9])/u).flatMap(s => chunkText(s.trim()))
    .map(s => s.replace(/^[•–-]\s*/, "").trim()).filter(s => s.length > 2)
    .filter(s => { const k = s.toLowerCase().replace(/[^a-z0-9çğıöşü]+/gi, " ").trim(); if (!k || seen.has(k)) return false; seen.add(k); return true; }).slice(0, 10);
}
const REDUNDANT = new Set(["Overview","Dates, ages and format","Schedule, ages and format","Fees","Location","Genel Bakış","Tarihler, Yaş Aralığı ve Format","Takvim, Yaş Aralığı ve Format","Ücretler","Konum"]);
function viewNow(rec, dg, l) {
  const L = LABELS[l];
  let secs = (l === "tr" ? rec.detail_sections_tr : rec.detail_sections) || [];
  if (!secs.length) secs = (rec.curriculum_sections || []).map(s => ({ title: s.title, body: s.body }));
  secs = secs.filter(s => !REDUNDANT.has(s.title));
  return `<div class="now">` + header(rec, l) + `<div class="warnbar">${L.nowWarn}</div>` +
    (secs.length ? secs.map(s => `<section><h3>${esc(s.title || "—")}</h3>${bullets(makeBullets(s.body || ""), li)}</section>`).join("")
                 : `<p class="note">(no detail sections in data)</p>`) + `</div>`;
}

/* --- shell */
function seg(el, items, cur, onPick) {
  el.innerHTML = items.map(([k, label]) => `<button aria-pressed="${k == cur}" data-k="${k}">${esc(label)}</button>`).join("");
  el.onclick = e => { const b = e.target.closest("button"); if (b) onPick(b.dataset.k); };
}
function render() {
  const id = ids[state.p], rec = DATA[id], dg = DIGESTS[id], l = state.l;
  seg(document.getElementById("progSeg"), ids.map((k, i) => [i, DIGESTS[k].short]), state.p, k => { state.p = +k; render(); });
  seg(document.getElementById("varSeg"), VARIANTS.map(([k, n]) => [k, k === "N" ? LABELS[l].now : n]), state.v, k => { state.v = k; render(); });
  seg(document.getElementById("langSeg"), [["en","English"],["tr","Türkçe"]], l, k => { state.l = k; render(); });
  document.getElementById("note").innerHTML = LABELS[l].note;
  document.documentElement.lang = l;
  const view = { A: viewA, B: viewB, C: viewC, N: viewNow }[state.v];
  document.getElementById("page").innerHTML = rec ? view(rec, dg, l) : "<p>Loading…</p>";
}
render();
fetch("../data/programs.normalized.json").then(r => r.json()).then(all => {
  ids.forEach(id => { DATA[id] = all.find(p => p.id === id); });
  render();
}).catch(e => { document.getElementById("page").innerHTML = "<p>Could not load ../data/programs.normalized.json — " + esc(e.message) + "</p>"; });
</script>
